# ГОСТ Р 56939-2024 в машиночитаемом виде: процессы, требования, артефакты и ссылки между ними.
#
# Из текста стандарта взяты только номера пунктов, наименования процессов (заголовки подразделов),
# уровни обязательности требований и ссылки «артефакты, учитываемые при выполнении требования».
# Поле label — краткая формулировка автора модели, а не текст стандарта. Официальный текст стандарта
# распространяет Росстандарт; эта модель не является официальным изданием и не заменяет стандарт.
#
# obligation (требование): mandatory — обязательно; recommended — «рекомендуется» в формулировке;
#   discretionary — по примечанию стандарта применяется по усмотрению (5.15.2, 5.24.2.3–5.24.2.4).
# if_applicable: true — в формулировке «(если применимо)».
# content (артефакт): required — «должен/должны содержать» или артефакт назван без оговорок;
#   optional — «может/могут содержать (использоваться, являться)».
# considers — номера артефактов, которые стандарт велит учитывать при выполнении требования.
#
# Лицензия данных: CC BY 4.0 (LICENSE-DATA). Автор модели: Kuzmin, Alexander (ORCID 0000-0002-0393-412X).

schema: rbpo-evidence/model/v1
model_version: 0.1.0
standard:
  id: "ГОСТ Р 56939-2024"
  title: "Защита информации. Разработка безопасного программного обеспечения. Общие требования"
  introduced: "2024-12-20"
  approved: "Приказ Росстандарта от 24 октября 2024 г. № 1504-ст"
  replaces: "ГОСТ Р 56939-2016"
  official_source: "https://www.rst.gov.ru"

processes:
  - id: "5.1"
    title: "Планирование процессов разработки безопасного программного обеспечения"
    requirements:
      - {id: "5.1.2.1", label: "Периодический анализ текущего статуса процессов РБПО", obligation: mandatory}
      - {id: "5.1.2.2", label: "Периодический анализ потребностей в ресурсах", obligation: mandatory}
      - {id: "5.1.2.3", label: "План развития процессов РБПО", obligation: mandatory, considers: ["5.1.3.1", "5.1.3.2"]}
      - {id: "5.1.2.4", label: "План реализации процессов РБПО", obligation: mandatory, considers: ["5.1.3.1", "5.1.3.2"]}
      - {id: "5.1.2.5", label: "Область применения процессов РБПО", obligation: mandatory}
    artifacts:
      - {id: "5.1.3.1", label: "Результаты анализа статуса процессов РБПО", content: required}
      - {id: "5.1.3.2", label: "Результаты анализа потребностей в ресурсах", content: optional}
      - {id: "5.1.3.3", label: "План развития процессов РБПО", content: required}
      - {id: "5.1.3.4", label: "План реализации процессов РБПО", content: required}
      - {id: "5.1.3.5", label: "Описание области применения процессов РБПО", content: required}
  - id: "5.2"
    title: "Обучение сотрудников"
    requirements:
      - {id: "5.2.2.1", label: "Анализ доступных практик, курсов и тренингов по РБПО", obligation: mandatory}
      - {id: "5.2.2.2", label: "План обучения с учётом потребностей разработчика", obligation: mandatory, considers: ["5.2.3.1"]}
      - {id: "5.2.2.3", label: "Обучение сотрудников", obligation: mandatory, considers: ["5.2.3.2"]}
      - {id: "5.2.2.4", label: "Учёт обучения сотрудников", obligation: mandatory, considers: ["5.2.3.2", "5.2.3.3", "5.2.3.6"]}
      - {id: "5.2.2.5", label: "Критерии пересмотра программ обучения", obligation: mandatory}
      - {id: "5.2.2.6", label: "Повышение осведомлённости о типовых угрозах, ошибках и уязвимостях", obligation: mandatory, considers: ["5.2.3.1"]}
    artifacts:
      - {id: "5.2.3.1", label: "Результаты анализа практик, курсов и тренингов", content: required}
      - {id: "5.2.3.2", label: "План обучения", content: required}
      - {id: "5.2.3.3", label: "Подтверждения прохождения обучения", content: required}
      - {id: "5.2.3.4", label: "Учёт обучения сотрудников", content: required}
      - {id: "5.2.3.5", label: "Критерии пересмотра программ обучения", content: required}
      - {id: "5.2.3.6", label: "Сведения о мероприятиях по повышению осведомлённости", content: required}
  - id: "5.3"
    title: "Формирование и предъявление требований безопасности к программному обеспечению"
    requirements:
      - {id: "5.3.2.1", label: "Регламент управления требованиями безопасности ПО", obligation: mandatory}
      - {id: "5.3.2.2", label: "Предъявление требований безопасности к ПО", obligation: mandatory, considers: ["5.3.3.1"]}
      - {id: "5.3.2.3", label: "Учёт требований, контроль однозначности и непротиворечивости", obligation: mandatory, considers: ["5.3.3.2"]}
      - {id: "5.3.2.4", label: "Пересмотр набора требований безопасности по критериям", obligation: mandatory, considers: ["5.3.3.1", "5.3.3.2"]}
    artifacts:
      - {id: "5.3.3.1", label: "Регламент управления требованиями безопасности ПО", content: required}
      - {id: "5.3.3.2", label: "Набор требований безопасности ПО", content: required}
      - {id: "5.3.3.3", label: "Учёт предъявленных требований безопасности", content: required}
      - {id: "5.3.3.4", label: "Уточнённый набор требований безопасности", content: required}
  - id: "5.4"
    title: "Управление конфигурацией программного обеспечения"
    requirements:
      - {id: "5.4.2.1", label: "Регламент управления конфигурацией", obligation: mandatory}
      - {id: "5.4.2.2", label: "Перечень элементов конфигурации", obligation: mandatory}
      - {id: "5.4.2.3", label: "Контроль изменений элементов конфигурации", obligation: mandatory}
    artifacts:
      - {id: "5.4.3.1", label: "Регламент управления конфигурацией ПО", content: required}
      - {id: "5.4.3.2", label: "Перечень элементов конфигурации", content: required}
      - {id: "5.4.3.3", label: "Свидетельства контроля изменений ПО и документации", content: required}
  - id: "5.5"
    title: "Управление недостатками и запросами на изменение программного обеспечения"
    requirements:
      - {id: "5.5.2.1", label: "Регламент управления недостатками ПО", obligation: mandatory}
      - {id: "5.5.2.2", label: "Регламент управления запросами на изменение", obligation: mandatory}
      - {id: "5.5.2.3", label: "Контроль изменений, связанных с недостатками", obligation: mandatory}
      - {id: "5.5.2.4", label: "Контроль запросов на изменение", obligation: mandatory}
      - {id: "5.5.2.5", label: "Средства автоматизации управления недостатками и запросами", obligation: mandatory}
    artifacts:
      - {id: "5.5.3.1", label: "Регламент управления недостатками ПО", content: required}
      - {id: "5.5.3.2", label: "Регламент управления запросами на изменение ПО", content: required}
      - {id: "5.5.3.3", label: "Записи об изменениях, связанных с недостатками", content: required}
      - {id: "5.5.3.4", label: "Записи о запросах на изменение", content: required}
  - id: "5.6"
    title: "Разработка, уточнение и анализ архитектуры программного обеспечения"
    requirements:
      - {id: "5.6.2.1", label: "Требования безопасности к принципам проектирования архитектуры", obligation: mandatory, considers: ["5.3.3.2"]}
      - {id: "5.6.2.2", label: "Первичное проектирование архитектуры", obligation: mandatory, considers: ["5.3.3.1", "5.6.3.1"]}
      - {id: "5.6.2.3", label: "Критерии уточнения архитектуры", obligation: mandatory, considers: ["5.6.3.2"]}
      - {id: "5.6.2.4", label: "Уточнение архитектуры в ходе разработки", obligation: mandatory, considers: ["5.6.3.2", "5.6.3.3"]}
    artifacts:
      - {id: "5.6.3.1", label: "Требования к принципам проектирования архитектуры", content: required}
      - {id: "5.6.3.2", label: "Описание архитектуры ПО", content: required}
      - {id: "5.6.3.3", label: "Критерии уточнения архитектуры", content: required}
      - {id: "5.6.3.4", label: "Уточнённая архитектура ПО", content: required}
  - id: "5.7"
    title: "Моделирование угроз и разработка описания поверхности атаки"
    requirements:
      - {id: "5.7.2.1", label: "Первичная модель угроз и перечень мер нейтрализации", obligation: mandatory, considers: ["5.6.3.2"]}
      - {id: "5.7.2.2", label: "Первичное описание поверхности атаки", obligation: mandatory, considers: ["5.6.3.2"]}
      - {id: "5.7.2.3", label: "Перечень целей для дальнейших исследований безопасности", obligation: mandatory, considers: ["5.6.3.2"]}
      - {id: "5.7.2.4", label: "Уточнение модели угроз", obligation: mandatory, considers: ["5.7.3.1", "5.7.3.3", "5.7.3.4"]}
      - {id: "5.7.2.5", label: "Уточнение описания поверхности атаки", obligation: mandatory, considers: ["5.7.3.1", "5.7.3.3", "5.7.3.4"]}
      - {id: "5.7.2.6", label: "Анализ поверхности атаки через идентификацию интерфейсов", obligation: mandatory, considers: ["5.7.3.1", "5.7.3.3", "5.7.3.4"]}
      - {id: "5.7.2.7", label: "Уточнение перечня целей исследований", obligation: mandatory, considers: ["5.7.3.1", "5.7.3.3", "5.7.3.4"]}
    artifacts:
      - {id: "5.7.3.1", label: "Модель угроз", content: required}
      - {id: "5.7.3.2", label: "Перечень мер нейтрализации угроз", content: required}
      - {id: "5.7.3.3", label: "Описание поверхности атаки", content: required}
      - {id: "5.7.3.4", label: "Перечень целей исследований безопасности", content: required}
      - {id: "5.7.3.5", label: "Уточнённая модель угроз", content: required}
      - {id: "5.7.3.6", label: "Уточнённое описание поверхности атаки", content: required}
      - {id: "5.7.3.7", label: "Уточнённый перечень целей исследований", content: required}
  - id: "5.8"
    title: "Формирование и поддержание в актуальном состоянии правил кодирования"
    requirements:
      - {id: "5.8.2.1", label: "Регламент оформления кода и безопасного кодирования", obligation: mandatory}
      - {id: "5.8.2.2", label: "Учёт примеров опасных и безопасных конструкций", obligation: mandatory}
      - {id: "5.8.2.3", label: "Учёт общепринятых стандартов кодирования", obligation: mandatory}
      - {id: "5.8.2.4", label: "Автоматическая проверка правил кодирования", obligation: recommended}
    artifacts:
      - {id: "5.8.3.1", label: "Регламент оформления кода и безопасного кодирования", content: required}
  - id: "5.9"
    title: "Экспертиза исходного кода"
    requirements:
      - {id: "5.9.2.1", label: "Регламент экспертизы исходного кода", obligation: mandatory}
      - {id: "5.9.2.2", label: "Экспертиза кода, прежде всего поверхности атаки", obligation: mandatory, considers: ["5.9.3.1"]}
      - {id: "5.9.2.3", label: "Автоматизация экспертизы и связь с системой контроля версий", obligation: recommended}
    artifacts:
      - {id: "5.9.3.1", label: "Регламент экспертизы исходного кода", content: required}
      - {id: "5.9.3.2", label: "Результаты экспертизы кода", content: required}
  - id: "5.10"
    title: "Статический анализ исходного кода"
    requirements:
      - {id: "5.10.2.1", label: "Регламент статического анализа", obligation: mandatory, considers: ["5.6.3.2"]}
      - {id: "5.10.2.2", label: "Инструменты статического анализа для каждого языка", obligation: mandatory, considers: ["5.6.3.2", "5.10.3.1"]}
      - {id: "5.10.2.3", label: "Конфигурация инструментов статического анализа", obligation: mandatory, considers: ["5.10.3.1", "5.10.3.2"]}
      - {id: "5.10.2.4", label: "Статический анализ с регистрацией всех предупреждений", obligation: mandatory, considers: ["5.10.3.1", "5.10.3.2", "5.10.3.3"]}
      - {id: "5.10.2.5", label: "Пересмотр конфигурации анализаторов по событиям", obligation: mandatory, considers: ["5.10.3.1", "5.10.3.2", "5.10.3.3"]}
      - {id: "5.10.2.6", label: "Повторный статический анализ", obligation: mandatory, considers: ["5.10.3.1", "5.10.3.2"]}
    artifacts:
      - {id: "5.10.3.1", label: "Регламент статического анализа", content: required}
      - {id: "5.10.3.2", label: "Перечень инструментов статического анализа", content: required}
      - {id: "5.10.3.3", label: "Конфигурации инструментов статического анализа", content: required}
      - {id: "5.10.3.4", label: "Отчёты статического анализа с разметкой срабатываний", content: required}
      - {id: "5.10.3.5", label: "Уточнённые конфигурации инструментов статического анализа", content: required}
  - id: "5.11"
    title: "Динамический анализ кода программы"
    requirements:
      - {id: "5.11.2.1", label: "Регламент динамического анализа", obligation: mandatory, considers: ["5.6.3.2", "5.7.3.1", "5.7.3.3"]}
      - {id: "5.11.2.2", label: "Инструменты динамического анализа и фаззинга", obligation: mandatory, considers: ["5.6.3.2", "5.7.3.1", "5.7.3.3", "5.7.3.4", "5.11.3.1"]}
      - {id: "5.11.2.3", label: "Перечень модулей для динамического анализа и фаззинга", obligation: mandatory, considers: ["5.6.3.2", "5.7.3.1", "5.7.3.3", "5.7.3.4", "5.11.3.1", "5.11.3.2"]}
      - {id: "5.11.2.4", label: "Сценарии тестирования для каждого модуля", obligation: mandatory, considers: ["5.6.3.2", "5.7.3.1", "5.7.3.3", "5.7.3.4", "5.11.3.1", "5.11.3.2", "5.11.3.3"]}
      - {id: "5.11.2.5", label: "Динамический анализ", obligation: mandatory, considers: ["5.6.3.2", "5.11.3.1", "5.11.3.2", "5.11.3.3", "5.11.3.4"]}
      - {id: "5.11.2.6", label: "Повторный динамический анализ после исправлений", obligation: mandatory, considers: ["5.6.3.2", "5.11.3.1", "5.11.3.2", "5.11.3.3", "5.11.3.4"]}
      - {id: "5.11.2.7", label: "Фаззинг-тестирование", obligation: mandatory, considers: ["5.6.3.2", "5.11.3.1", "5.11.3.2", "5.11.3.3", "5.11.3.4"]}
      - {id: "5.11.2.8", label: "Тестовые коллекции входных данных для фаззинга", obligation: mandatory, considers: ["5.6.3.2", "5.7.3.1", "5.7.3.3", "5.7.3.4", "5.11.3.1", "5.11.3.2", "5.11.3.3", "5.11.3.4"]}
      - {id: "5.11.2.9", label: "Устранение ошибок, найденных динамическим анализом", obligation: mandatory, considers: ["5.11.3.1", "5.11.3.5", "5.11.3.6"]}
    artifacts:
      - {id: "5.11.3.1", label: "Регламент динамического анализа", content: required}
      - {id: "5.11.3.2", label: "Перечень инструментов динамического анализа и фаззинга", content: required}
      - {id: "5.11.3.3", label: "Перечень модулей для динамического анализа", content: required}
      - {id: "5.11.3.4", label: "Сценарии динамического тестирования", content: required}
      - {id: "5.11.3.5", label: "Отчёты динамического анализа", content: required}
      - {id: "5.11.3.6", label: "Отчёты фаззинг-тестирования", content: required}
  - id: "5.12"
    title: "Использование безопасной системы сборки программного обеспечения"
    requirements:
      - {id: "5.12.2.1", label: "Регламент использования безопасной системы сборки", obligation: mandatory}
      - {id: "5.12.2.2", label: "Сведения о системе сборки и сборочной среде", obligation: mandatory, considers: ["5.12.3.1"]}
      - {id: "5.12.2.3", label: "Выполнение рекомендаций производителей инструментов сборки", obligation: mandatory}
    artifacts:
      - {id: "5.12.3.1", label: "Регламент использования системы безопасной сборки", content: required}
      - {id: "5.12.3.2", label: "Сведения о сборочной среде и её инструментах", content: required}
      - {id: "5.12.3.3", label: "Перечень выполненных рекомендаций по инструментам сборки", content: required}
  - id: "5.13"
    title: "Обеспечение безопасности сборочной среды программного обеспечения"
    requirements:
      - {id: "5.13.2.1", label: "Регламент безопасности сборочной среды", obligation: mandatory}
      - {id: "5.13.2.2", label: "Ожидаемые результаты сборки, права доступа и роли", obligation: mandatory}
      - {id: "5.13.2.3", label: "Схема сборочной среды", obligation: mandatory, considers: ["5.13.3.2"]}
      - {id: "5.13.2.4", label: "Журналы аудита сборки с защитой целостности", obligation: mandatory, considers: ["5.13.3.1", "5.13.3.2"]}
      - {id: "5.13.2.5", label: "Хранилище результатов сборки", obligation: mandatory, considers: ["5.13.3.1", "5.13.3.2"]}
      - {id: "5.13.2.6", label: "Повторяемость сборки", obligation: mandatory, if_applicable: true}
      - {id: "5.13.2.7", label: "Ролевое управление доступом к среде сборки", obligation: mandatory}
      - {id: "5.13.2.8", label: "Защита каналов связи с внешними источниками", obligation: mandatory}
    artifacts:
      - {id: "5.13.3.1", label: "Регламент безопасности сборочной среды", content: required}
      - {id: "5.13.3.2", label: "Сведения о безопасности сборочной среды", content: required}
      - {id: "5.13.3.3", label: "Схема сборочной среды", content: required}
      - {id: "5.13.3.4", label: "Журналы аудита сборки", content: required}
      - {id: "5.13.3.5", label: "Подтверждение хранения результатов сборки (журнал, контрольные суммы)", content: optional}
      - {id: "5.13.3.6", label: "Подтверждение повторяемости сборки (сравнение сборок)", content: optional}
  - id: "5.14"
    title: "Управление доступом и контроль целостности кода при разработке программного обеспечения"
    requirements:
      - {id: "5.14.2.1", label: "Регламент доступа к исходному коду и его целостности", obligation: mandatory}
      - {id: "5.14.2.2", label: "Управление доступом к исходному коду по модели доступа", obligation: mandatory, considers: ["5.14.3.1"]}
