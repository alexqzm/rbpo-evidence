    title: "Поиск уязвимостей в программном обеспечении при эксплуатации"
    requirements:
      - {id: "5.24.2.1", label: "Регламент поиска ошибок и уязвимостей при эксплуатации", obligation: mandatory, considers: ["5.6.3.1", "5.7.3.1", "5.7.3.3"]}
      - {id: "5.24.2.2", label: "Регулярная актуализация сведений об уязвимостях из открытых источников", obligation: mandatory, considers: ["5.16.3.2", "5.24.3.1"]}
