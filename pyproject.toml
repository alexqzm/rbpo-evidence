[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "rbpo-evidence"
version = "0.1.0"
description = "ГОСТ Р 56939-2024 как граф доказательств: модель процессов, требований и артефактов РБПО, проверка полноты свидетельств"
readme = "README.md"
license = {text = "Apache-2.0 (code), CC-BY-4.0 (data)"}
requires-python = ">=3.10"
authors = [{name = "Alexander Kuzmin"}]
dependencies = ["pyyaml>=5.4"]
keywords = ["secure software development", "SSDLC", "РБПО", "ГОСТ Р 56939", "NIST SSDF", "software supply chain"]

[project.optional-dependencies]
test = ["pytest>=7", "jsonschema>=3.2"]

[project.scripts]
rbpo-evidence = "rbpo_evidence.cli:main"

[project.urls]
Repository = "https://github.com/alexqzm/rbpo-evidence"

[tool.hatch.build.targets.wheel]
packages = ["rbpo_evidence"]

# Модель, сопоставления и схемы лежат в корне репозитория; в колесо они кладутся внутрь пакета,
# чтобы `pip install git+https://…` давал рабочую установку без исходного дерева.
[tool.hatch.build.targets.wheel.force-include]
"model" = "rbpo_evidence/_data/model"
"crosswalk" = "rbpo_evidence/_data/crosswalk"
"schema" = "rbpo_evidence/_data/schema"

[tool.hatch.build.targets.sdist]
exclude = ["/.github"]

[tool.pytest.ini_options]
testpaths = ["tests"]
